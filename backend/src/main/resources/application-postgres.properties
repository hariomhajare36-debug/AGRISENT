# Cloud PostgreSQL Profile for Render / Railway Deployments
server.port=${PORT:8080}
spring.application.name=agrirent-postgres

# Datasource configuration for PostgreSQL (supports standard Render env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/agrirent_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# Flyway is disabled on Postgres because existing migrations are MSSQL T-SQL specific
spring.flyway.enabled=false

# Hibernate automatically detects database dialect from JDBC connection and updates schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.agrirent.app=INFO
