# Docker / Cloud Production Profile (Used by Render, Railway, Docker)
server.port=${PORT:8080}
spring.application.name=agrirent-cloud

# Database: If SPRING_DATASOURCE_URL is set in Render environment, it uses that;
# otherwise, it falls back to embedded H2 with MSSQL compatibility mode so it starts up reliably.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/agrirent_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway: Disabled by default for embedded H2, enabled if external MSSQL is connected
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate auto-detected dialect and update schema
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.com.agrirent.app=INFO
