# Spring Boot Server Configuration
server.port=8080

# Application Name
spring.application.name=agrirent-backend

# Microsoft SQL Server (MSSQL) Datasource Configuration
# Points to local SQL Server Express TEW_SQLEXPRESS instance
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost;instanceName=TEW_SQLEXPRESS;databaseName=agrirent_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agrirent_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:AgriRent@2026!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway Database Migration Configuration
# Versioned scripts located in classpath and workspace /database/migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Spring Data JPA / Hibernate Configuration
# Disable ddl-auto update so schema is 100% version-controlled via Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
# 256-bit base64/hex secret for HMAC-SHA256 signing
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity in milliseconds (24 hours)
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.com.agrirent.app=DEBUG
